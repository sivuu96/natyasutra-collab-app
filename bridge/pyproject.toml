[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collab-bridge"
version = "0.1.0"
description = "Local bridge connecting Claude Code and Codex on this machine to the NatyaSutra hub."
requires-python = ">=3.11"
dependencies = ["websockets>=13", "httpx>=0.27", "pydantic>=2.7", "keyring>=25"]

[project.scripts]
collab-bridge = "collab_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["collab_bridge*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
