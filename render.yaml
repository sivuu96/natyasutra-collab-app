# Render Blueprint: one web service (API + built UI, from deploy/Dockerfile) and one PostgreSQL database.
# Create it in Render: New > Blueprint > select this repository. See docs/deployment.md.
#
# Both resources use Render's free plan. Free limits that matter here:
# - The web service sleeps after ~15 minutes without traffic; the first request after that takes ~30-60 s.
# - The free PostgreSQL database expires 30 days after creation and has no backups. Upgrade it, or export
#   your data, before then.
# - Free web services are limited to one instance, which this app requires anyway.

services:
  - type: web
    name: natyasutra-hub
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: natyasutra-hub-db
          property: connectionString
      # Generated by Render; used to sign bridge access tokens. Never commit a real value.
      - key: BRIDGE_TOKEN_SECRET
        generateValue: true
      # Closed by default: create accounts with the manage command (see docs/deployment.md).
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: natyasutra-hub-db
    databaseName: natyasutra_hub
    user: natyasutra_hub
    plan: free
    region: oregon
