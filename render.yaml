# Render Blueprint: one web service (API + built UI, from deploy/Dockerfile) and one PostgreSQL database.
# Create it in Render: New > Blueprint > select this repository. See docs/deployment.md.
#
# Both resources use Render's free plan. Read the limits in README.md ("Free hosting limits") before using it:
# - The web service spins down after 15 minutes without inbound traffic; waking it takes about a minute.
# - The free PostgreSQL database expires 30 days after creation, then has a 14-day grace period to upgrade,
#   after which Render deletes it. It has no backups and a 1 GB limit. Export your data before day 30.
# - The hub must run as a single instance (see docs/deployment.md).

services:
  - type: web
    name: natyasutra-hub
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: natyasutra-hub-db
          property: connectionString
      # Generated by Render; used to sign bridge access tokens. Never commit a real value.
      - key: BRIDGE_TOKEN_SECRET
        generateValue: true
      # Closed by default: create accounts with the manage command (see docs/deployment.md).
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: natyasutra-hub-db
    databaseName: natyasutra_hub
    user: natyasutra_hub
    plan: free
    region: oregon
