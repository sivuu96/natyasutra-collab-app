# Render Blueprint: one web service (API + built UI, from deploy/Dockerfile).
# The database is hosted on Supabase, not Render. Create it in Render: New > Blueprint > select this repository.
# See docs/deployment.md.
#
# The web service uses Render's free plan. Read the limits in README.md ("Free hosting limits") before using it:
# - The web service spins down after 15 minutes without inbound traffic; waking it takes about a minute.
# - The hub must run as a single instance (see docs/deployment.md).

services:
  - type: web
    name: natyasutra-hub
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set in the Render dashboard (Environment), not here. Value: the Supabase Session pooler URL,
      # with the password URL-encoded. See docs/deployment.md, section "Database (Supabase)".
      - key: DATABASE_URL
        sync: false
      # Generated by Render; used to sign bridge access tokens. Never commit a real value.
      - key: BRIDGE_TOKEN_SECRET
        generateValue: true
      # Closed by default: create accounts with the manage command (see docs/deployment.md).
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: LOG_LEVEL
        value: INFO
