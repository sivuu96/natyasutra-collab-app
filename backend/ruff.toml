line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
# FastAPI's dependency injection idiom uses Depends() in argument defaults.
ignore = ["B008"]

[lint.per-file-ignores]
# Alembic revisions are generated; long CHECK-constraint strings are expected there.
"migrations/versions/*" = ["E501"]
