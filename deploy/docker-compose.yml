# Run the whole hub locally with the production image.
#   1. Create deploy/.env containing:  BRIDGE_TOKEN_SECRET=<at least 32 random characters>
#   2. docker compose -f deploy/docker-compose.yml up --build
#   3. Open http://localhost:8080
# Postgres credentials below are local-only. Do not reuse them anywhere public.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://collab:change-me-locally@postgres:5432/collab
      BRIDGE_TOKEN_SECRET: ${BRIDGE_TOKEN_SECRET:?set BRIDGE_TOKEN_SECRET in deploy/.env}
      CORS_ORIGINS: http://localhost:8080
      # Plain HTTP on localhost only. Public deployments are HTTPS and keep secure cookies.
      COOKIE_SECURE: "false"
      ALLOW_REGISTRATION: "true"
    ports:
      - "8080:8000"

volumes:
  pgdata:
