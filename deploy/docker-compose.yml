# Local development only. Credentials here are throwaway defaults for localhost.
# NOT verified on this machine yet: Docker Desktop was not running during Phase 1 task 1.2.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
